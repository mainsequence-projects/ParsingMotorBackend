# KB extractor — deterministic rules. The engine loads, validates and hashes this file.
# Every check in the output cites rule_id + rules_version (sha256 of this file).
# Allowed severities for checks: passed | discrepancy | warning | manual_review
# (FIELD_RECONCILE may also map to "missing" because it is a field status).
schema_version: 1
label: "kb-rules-2026-10-19-v04"

rules:
  - id: FIELD_RECONCILE
    scope: field
    description:
      es: "Concilia Textract y Bedrock campo a campo. El código decide; el LLM nunca elige el valor."
      en: "Reconciles Textract and Bedrock per field. Code decides; the LLM never picks the value."
    params:
      pass_conf: 0.9                 # Textract conf needed for 'passed' when both engines agree
      # Doble grabación: si OCR y LLM dan EXACTAMENTE el mismo valor normalizado, basta con que
      # Textract no diga que es más probable que esté mal (conf >= 0.5). Coincidencias difusas
      # (direcciones/texto por similitud) siguen necesitando pass_conf. Ver NOTAS §14.
      agree_exact_min_conf: 0.5
      amount_ocr_wins_min_conf: 0.9  # on amount disagreement, OCR value is kept only at >= this conf; else Bedrock
      ocr_preferred_min_conf: 0.4    # other OCR-native types: keep OCR value on disagreement from this conf
      ocr_preferred_types: [amount, date, birth_number, iban, id, name]
      text_similarity: 0.92          # address/free text agreement ratio
      amount_tolerance: 0.01         # relative tolerance for amounts to count as agreement
    severity:
      agree_high_conf: passed
      agree_exact: passed
      agree_low_conf: warning
      llm_only: warning
      ocr_only_high_conf: warning
      ocr_only_low_conf: manual_review
      disagree: manual_review
      ocr_unparseable: manual_review   # OCR leyó algo no parseable (p. ej. '15200E.00'): no es "solo LLM"
      # Textract no soporta checo: pierde ř/š/č/í/ú ('Ondřej' -> 'Ondej'). Si la ÚNICA diferencia son
      # esas letras, es coincidencia; se guarda la grafía del LLM (con diacríticos). Ver NOTAS §17.
      agree_ocr_no_diacritics: passed
      both_missing: missing

  - id: RC_VALID
    scope: document
    check: birth_number_valid
    description:
      es: "Rodné číslo válido: 10 dígitos divisibles por 11 (o regla legacy), o 9 dígitos antes de 1954; mes con offsets."
      en: "Valid Czech birth number: 10 digits divisible by 11 (or legacy rule), or 9 digits before 1954; month offsets."
    params:
      modulus: 11
      lengths: [9, 10]
      nine_digit_before_year: 1954
      century_pivot_yy: 54           # 10-digit: yy >= pivot -> 19yy, else 20yy
      female_month_offsets: [50, 70]
      male_month_offsets: [20]       # +20 / +70 exist since 2004 when numbers ran out
      allow_legacy_check_digit_zero: true   # first 9 digits mod 11 == 10 and last digit 0
      legacy_check_digit_until_year: 1985   # esa excepción solo existió hasta 1985
      extra_offsets_from_year: 2004         # +20 / +70 solo para nacidos desde 2004
      reject_future_dates: true             # fecha codificada posterior a la del run → inválido
    severity:
      valid: passed
      invalid: discrepancy

  - id: RC_BIRTHDATE_MATCH
    scope: document
    check: birth_date_matches_birth_number
    description:
      es: "La fecha de nacimiento del documento coincide con la codificada en el rodné číslo."
      en: "Document birth date matches the date encoded in the birth number."
    params: {}
    severity:
      match: passed
      mismatch: discrepancy

  - id: CONTRACT_INCOME_NOT_LOAN
    scope: document
    check: declared_income_not_loan_amount
    description:
      es: "El ingreso declarado no puede ser igual al importe del préstamo (señal de extracción errónea)."
      en: "Declared income must not equal the loan amount (sign of mis-extraction)."
    params: {}
    severity:
      ok: passed
      equal: discrepancy

  - id: ID_NOT_EXPIRED
    scope: document
    check: id_card_not_expired
    description:
      es: "El documento de identidad no está caducado en la fecha del contrato."
      en: "The ID card is not expired at the contract date."
    params: {}
    severity:
      valid: passed
      expired: discrepancy

  - id: XDOC_BIRTH_NUMBER
    scope: package
    check: birth_number_consistent
    description:
      es: "El rodné číslo es el mismo en todos los documentos que lo llevan."
      en: "Birth number is identical across all documents carrying it."
    params: {}
    severity:
      consistent: passed
      inconsistent: discrepancy

  - id: XDOC_FIRST_NAME
    scope: package
    check: first_name_consistent
    description:
      es: "El nombre coincide entre documentos (sin diacríticos ni mayúsculas)."
      en: "First name matches across documents (diacritics/case-insensitive)."
    params: {}
    severity:
      consistent: passed
      inconsistent: discrepancy

  - id: XDOC_LAST_NAME
    scope: package
    check: last_name_consistent
    description:
      es: "El apellido coincide entre documentos; casi-iguales (typo) son aviso."
      en: "Surname matches across documents; near-misses (typos) are a warning."
    params:
      near_miss_ratio: 0.85
    severity:
      consistent: passed
      near_miss: warning
      engine_disagreement: warning
      inconsistent: discrepancy

  - id: XDOC_FULL_NAME
    scope: package
    check: holder_name_consistent
    description:
      es: "El titular (extracto / justificante de domicilio) coincide con nombre+apellido del contrato."
      en: "Holder name (statement / proof of address) matches the contract first+last name."
    params:
      near_miss_ratio: 0.85
      holder_fields: [account_holder, full_name, employee_name]   # campos "nombre completo" por tipo
    severity:
      consistent: passed
      near_miss: warning
      inconsistent: discrepancy

  - id: XDOC_ADDRESS
    scope: package
    check: address_consistent
    description:
      es: "La dirección coincide entre contrato, DNI y justificante (similitud de texto)."
      en: "Address matches across contract, ID and proof of address (text similarity)."
    params:
      similarity: 0.85
    severity:
      consistent: passed
      inconsistent: warning

  - id: XDOC_INCOME
    scope: package
    description:
      es: "Ingreso declarado en contrato vs nómina vs abono de salario en extracto, con tolerancia relativa."
      en: "Contract declared income vs payslip net vs salary credit on statement, relative tolerance."
    params:
      tolerance: 0.01
      pairs:
        - {check: income_contract_vs_payslip, a: contract.declared_monthly_income, b: payslip.net_income}
        - {check: income_contract_vs_statement, a: contract.declared_monthly_income, b: bank_statement.salary_credit}
        - {check: income_payslip_vs_statement, a: payslip.net_income, b: bank_statement.salary_credit}
        - {check: income_contract_vs_employer, a: contract.declared_monthly_income, b: employer_confirmation.monthly_net_income}
        - {check: income_payslip_vs_employer, a: payslip.net_income, b: employer_confirmation.monthly_net_income}
    severity:
      within_tolerance: passed
      out_of_tolerance: discrepancy

  - id: LOAN_AMOUNT_PRESENT
    scope: package
    check: loan_amount_present
    description:
      es: "El contrato tiene importe de préstamo."
      en: "The contract carries a loan amount."
    params: {}
    severity:
      present: passed
      absent: manual_review

  - id: COMPLETENESS
    scope: package
    check: required_documents_present
    description:
      es: "Están el contrato y todos los documentos que exige (o la lista por defecto si el contrato no la trae)."
      en: "The contract and every document it requires are present (or the default list if the contract has none)."
    params:
      always_required: [contract]   # sin contrato no hay lista de requisitos: siempre se pide
      default_required: [id_card, bank_statement, payslip, proof_of_address]
      # 2º lector determinista de la lista del contrato (líneas OCR de Textract). Sin diacríticos.
      list_parser:
        section_headers: ["required documents", "pozadovane dokumenty", "povinne prilohy",
                          "documents to submit", "doklady k predlozeni"]
        synonyms:
          id_card: ["national id", "id card", "identity card", "obcansky prukaz", "obcanskeho prukazu"]
          bank_statement: ["bank statement", "account statement", "vypis z uctu", "vypis z bankovniho uctu"]
          payslip: ["payslip", "pay slip", "salary slip", "vyplatni listek", "vyplatni paska"]
          proof_of_address: ["proof of address", "utility bill", "doklad o bydlisti", "potvrzeni o bydlisti"]
          employer_confirmation: ["employer confirmation", "confirmation of employment", "employment confirmation",
                                   "potvrzeni o zamestnani", "potvrzeni o zamestnani a prijmu", "potvrzeni o vysi prijmu"]
          tax_or_debt_certificate: ["tax clearance", "no debt certificate", "certificate of no tax arrears",
                                    "potvrzeni o bezdluznosti", "potvrzeni o nedoplatcich", "bezdluznost"]
    severity:
      complete: passed
      incomplete: manual_review
      unrecognised_type: manual_review   # el contrato pide un tipo que el motor no sabe reconocer

  - id: CONTRACT_SINGLE
    scope: package
    check: single_contract
    description:
      es: "El paquete trae un único contrato; con varios no se sabe cuál define los requisitos."
      en: "The package carries exactly one contract; with several, the required set is ambiguous."
    params: {}
    severity:
      single: passed
      multiple: manual_review

  - id: MODEL_PRIMARY
    scope: package
    check: primary_models_used
    description:
      es: "Se usaron los modelos previstos; si Bedrock cayó a un modelo de respaldo, se avisa (no se oculta)."
      en: "The intended models were used; a fallback model (Bedrock error/throttling) is flagged, never hidden."
    params:
      classification: eu.anthropic.claude-haiku-4-5-20251001-v1:0
      extraction: eu.anthropic.claude-sonnet-4-5-20250929-v1:0
    severity:
      primary: passed
      fallback: warning

  - id: PAGE_CONTINUITY
    scope: package
    check: pages_complete
    description:
      es: "Cada documento multipágina tiene todas sus páginas (según marcas 'Página x de y')."
      en: "Each multi-page document has all its pages (per 'Page x of y' markers)."
    params: {}
    severity:
      complete: passed
      gap: manual_review
      no_markers: passed

  - id: UNEXPECTED_DOCUMENTS
    scope: package
    check: no_unrequested_documents
    description:
      es: "Documentos aportados que el contrato no pide (se avisa, no se bloquea)."
      en: "Documents provided that the contract does not require (warn, do not block)."
    params:
      ignore_types: [contract]
    severity:
      none: passed
      present: warning

  - id: XDOC_EMPLOYER
    scope: package
    check: employer_consistent
    description:
      es: "El empleador de la nómina coincide con el de la confirmación de empleo (texto sin diacríticos)."
      en: "Employer name on the payslip matches the employer confirmation (diacritics-insensitive)."
    params:
      similarity: 0.85
    severity:
      consistent: passed
      inconsistent: discrepancy

  - id: DOC_RECENT
    scope: package
    description:
      es: "Confirmación de empleo y certificado de sin deudas emitidos hace como máximo N días (por defecto 30)."
      en: "Employer confirmation and no-debt certificate issued within the last N days (default 30)."
    params:
      max_age_days: 30
      fields:
        - {check: employer_confirmation_recent, doc_type: employer_confirmation, field: issue_date}
        - {check: tax_certificate_recent, doc_type: tax_or_debt_certificate, field: issue_date}
    severity:
      recent: passed
      stale: discrepancy
      undated: manual_review

  - id: TAX_CLEAR
    scope: document
    check: no_tax_arrears
    description:
      es: "El certificado del Finanční úřad declara que no hay deudas fiscales (campo sí/no leído por los dos motores)."
      en: "The tax office certificate states there are no tax arrears (yes/no field read by both engines)."
    params: {}
    severity:
      clear: passed
      has_arrears: discrepancy
      unclear: manual_review

  - id: XDOC_HOLDER_RC
    scope: package
    check: certificate_holder_matches_id
    description:
      es: "El titular del certificado de sin deudas (nombre y RČ) coincide con el DNI / contrato."
      en: "No-debt certificate holder (name and birth number) matches the ID / contract."
    params:
      near_miss_ratio: 0.85
    severity:
      consistent: passed
      near_miss: warning
      inconsistent: discrepancy


next_step:
  description:
    es: "Política de siguiente paso. Se evalúa en orden; gana la primera condición que se cumple."
    en: "Next-step policy. Evaluated in order; first matching condition wins."
  params:
    manual_review_extraction_min_fields: 3
  order:
    - {when: any_check_discrepancy, step: manual_review_discrepancy}
    - {when: missing_documents_or_pages, step: request_missing_documents}
    - {when: many_field_manual_review, step: manual_review_extraction}
    - {when: any_field_missing, step: manual_review_extraction}   # un dato clave sin leer nunca se aprueba
    - {when: any_warning_or_manual_review, step: spot_check_warnings}
    - {when: always, step: approve_ready}
