[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parsingmotorbackend"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.110,<1",
  "mainsequence==8.1.10",
  "mainsequence[server]",
  "uvicorn==0.52.4",
  # KB extractor (FinTechers hackathon)
  "boto3>=1.34",
  "mangum>=0.17",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24",
  "Pillow>=10.0",
  "PyYAML>=6.0",
  "reportlab>=4.0",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*", "extractor*"]

[tool.setuptools.package-data]
extractor = ["schemas.yaml", "rules.yaml"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = [
  "build", "dist", ".venv", ".tox", ".mypy_cache", ".ruff_cache"
]
fix = true

[tool.ruff.lint]
select = ["I"]
ignore = ["E203", "E501"]

[tool.ruff.lint.isort]
known-first-party = ["api", "mainsequence", "src", "extractor"]
src-paths = ["src", "api", "."]
