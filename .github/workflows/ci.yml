name: CI

on:
  pull_request:
  push:
    branches: [main, feat/kb-extractor]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar dependencias del extractor (sin mainsequence[server], solo existe en la plataforma)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "boto3>=1.34" "mangum>=0.17" "python-multipart>=0.0.9" \
            "pymupdf>=1.24" "Pillow>=10.0" "PyYAML>=6.0" "reportlab>=4.0" "pypdf>=4.0" \
            pytest httpx
      - name: Tests (sin credenciales AWS, sin coste)
        run: python -m pytest -q
